[project]
name = "code"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alive-progress>=3.3.0",
    "gmpy2>=2.3.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "typst-pyexec>=0.0.7",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
]

[tool.uv.workspace]
members = [
    "rsa/rust - Copy - Copy/python",
]
