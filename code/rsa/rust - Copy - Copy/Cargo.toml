[package]
name = "square_multiply_timing_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
rug = { version = "1.27", default-features = false, features = ["integer"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 0
debug = true
codegen-units = 1
lto = false
